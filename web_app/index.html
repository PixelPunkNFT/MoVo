<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="description" content="Movo - Passaggi e prevendite per la community latina di Roma" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Movo" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/Movo.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#D4AF37" />
    <title>Movo - Passaggi & Eventi Latino</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0F0F0F; color: #D4AF37;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-logo {
        width: 80px; height: 80px; border-radius: 20px;
        background: linear-gradient(135deg, #D4AF37 0%, #F0D060 50%, #D4AF37 100%);
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; color: #0F1115;
        font-family: sans-serif;
        box-shadow: 0 4px 24px rgba(212, 175, 55, 0.25);
        margin-bottom: 20px;
      }
      #splash-spinner {
        width: 192px; height: 192px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img id="splash-spinner" src="/Movo.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
